<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Configurar Escala TJCE</title><style>body{font:16px Segoe UI,Arial,sans-serif;background:#f5f7fa;color:#20334a;margin:0}.box{max-width:600px;margin:12vh auto;background:white;border-radius:16px;padding:32px;box-shadow:0 8px 30px #0002}h1{font-size:26px}label{display:block;margin:18px 0 8px}input{width:100%;box-sizing:border-box;padding:12px;font:inherit;border:1px solid #aab5c0;border-radius:8px}button{padding:12px 20px;background:#215d85;color:white;border:0;border-radius:8px;cursor:pointer}#message{color:#a12626}</style></head><body><div class="box"><h1>Escala TJCE · Área Cível</h1><p>Informe o endereço HTTPS do sistema publicado na intranet do MPCE. O aplicativo Windows usará a mesma base de dados e solicitará seu usuário e senha.</p><form id="form"><label for="url">Endereço HTTPS da intranet</label><input id="url" type="url" placeholder="https://intranet.exemplo.mpce/" required><p><button>Conectar</button></p></form><p id="message" role="alert"></p></div><script>window.setup.currentUrl().then(url=>{document.querySelector("#url").value=url});document.querySelector("#form").addEventListener("submit",async event=>{event.preventDefault();const result=await window.setup.configureUrl(document.querySelector("#url").value);if(!result.ok)document.querySelector("#message").textContent=result.error})</script></body></html>
