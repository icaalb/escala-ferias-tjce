name: Gerar instalador Windows 8.1

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "windows/escala-tjce.ico"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        working-directory: desktop
        run: npm install
      - name: Verificar JavaScript
        run: |
          node --check frontend/app.js
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
      - name: Gerar instalador por usuário
        working-directory: desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Escala-TJCE-Area-Civel-8.1-Windows
          path: desktop/dist/Instalar-Escala-TJCE-Area-Civel-8.1.exe
          if-no-files-found: error

